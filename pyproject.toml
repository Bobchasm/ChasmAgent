[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chasm-agent"
version = "0.1.0"
description = "A small coding agent built for the NJU software engineering assessment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.6.0",
  "fastapi>=0.141.0",
  "uvicorn[standard]>=0.52.0",
  "pydantic>=2.13.0",
  "rich>=15.0.0",
  "httpx>=0.28.0",
  "typer>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
]

[project.scripts]
chasm-agent = "coding_agent.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

