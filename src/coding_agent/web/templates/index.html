<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chasm Agent</title>
    <link rel="stylesheet" href="/static/app.css?v=20260901-12" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div class="brand">Chasm Agent</div>
          <div class="subtle">Local coding agent for file edits, commands, and memory.</div>
        </div>
        <div class="project-bar">
          <button id="open-project">Open Project</button>
          <div class="project-info" id="project-info"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status" id="status">idle</div>
        <div class="auth-chip" id="auth-user">guest</div>
        <button id="logout-btn" class="ghost small-btn">Logout</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel sidebar">
        <div class="panel-title">Files</div>
        <div id="tree-list" class="file-list">Loading...</div>
      </aside>

      <section class="panel editor">
        <div class="panel-title">Editor</div>
        <input id="file-path" placeholder="Select a file from workspace" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:6px;" />
        <div id="editor" class="code-editor"></div>
        <div class="controls editor-actions">
          <button id="save-file" class="small-btn">Save</button>
          <button id="refresh-tree" class="ghost small-btn">Refresh</button>
        </div>
      </section>

      <aside class="panel session-panel">
        <div class="agent-head">
          <div class="agent-head-left">
            <div class="panel-title">Agent</div>
            <div class="subtle" id="active-session-label">No conversation selected</div>
          </div>
          <div class="agent-head-actions">
            <button id="conversation-toggle" class="ghost small-btn">Conversations</button>
            <button id="new-chat" class="small-btn">New Chat</button>
          </div>
        </div>
        <div id="conversation-menu" class="conversation-menu hidden"></div>
        <div id="chat-view" class="chat-view"></div>
        <div class="composer-box">
          <textarea id="task" placeholder="Ask the agent to make a change..."></textarea>
          <div class="composer-actions">
            <select id="mode" class="small-select">
              <option value="auto">Auto</option>
              <option value="dry-run">Dry run</option>
            </select>
            <button id="stop-btn" class="ghost small-btn">Stop</button>
            <button id="send-btn" class="small-btn">Send</button>
          </div>
        </div>
      </aside>
    </main>

    <div id="project-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <div class="panel-title">Project Picker</div>
            <div class="subtle" id="browse-path-label"></div>
          </div>
          <button id="close-project-modal" class="ghost">Close</button>
        </div>
        <div class="browse-toolbar">
          <button id="browse-up" class="ghost">Up</button>
          <input id="browse-path" />
          <button id="browse-go">Go</button>
        </div>
        <div id="browse-list" class="browse-list"></div>
        <div class="controls" style="justify-content: flex-end; margin-top: 12px;">
          <button id="use-project">Use Folder</button>
        </div>
      </div>
    </div>

    <div id="auth-modal" class="modal hidden">
      <div class="modal-card auth-card">
        <div class="modal-head">
          <div>
            <div class="panel-title">Sign in</div>
            <div class="subtle" id="auth-note">Use a local account to keep sessions and history.</div>
          </div>
          <button id="auth-bootstrap" class="ghost">Bootstrap Local</button>
        </div>
        <div class="auth-grid">
          <div class="auth-block">
            <div class="auth-title">Login</div>
            <input id="login-username" placeholder="Username" />
            <input id="login-password" type="password" placeholder="Password" />
            <button id="login-btn">Login</button>
          </div>
          <div class="auth-block">
            <div class="auth-title">Register</div>
            <input id="register-username" placeholder="Username" />
            <input id="register-password" type="password" placeholder="Password" />
            <button id="register-btn" class="ghost">Create Account</button>
          </div>
        </div>
        <div class="subtle" id="auth-status"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="/static/app.js?v=20260901-12"></script>
  </body>
</html>
