<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chasm Agent</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div>
          <div class="brand">Chasm Agent</div>
          <div class="subtle">Local coding agent for file edits, commands, and memory.</div>
        </div>
        <div class="project-bar">
          <input id="project-path" placeholder="Open local project path" />
          <button id="open-project">Open Project</button>
          <div class="project-info" id="project-info"></div>
        </div>
      </div>
      <div class="status" id="status">idle</div>
    </header>

    <main class="layout">
      <aside class="panel sidebar">
        <div class="panel-title">Files</div>
        <div id="tree-list" class="file-list">Loading...</div>
        <div class="panel-title" style="margin-top:16px;">Sessions</div>
        <div id="session-list" class="session-list"></div>
      </aside>

      <section class="panel editor">
        <div class="panel-title">Editor</div>
        <input id="file-path" placeholder="Select a file from workspace" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:6px;" />
        <textarea id="file-content" placeholder="File content will appear here..."></textarea>
        <div class="controls">
          <button id="save-file">Save</button>
          <button id="refresh-tree" class="ghost">Refresh</button>
        </div>
      </section>

      <aside class="panel session-panel">
        <div class="panel-title">Agent</div>
        <label for="task">Task</label>
        <textarea id="task" placeholder="Describe the coding job you want the agent to do."></textarea>
        <div class="controls">
          <select id="mode">
            <option value="auto">Auto</option>
            <option value="dry-run">Dry run</option>
          </select>
          <button id="run-btn">Run</button>
        </div>
        <div style="margin-top:12px;">
          <div class="panel-title" style="margin-top:6px;">Session</div>
          <pre id="session-view" class="stream">No session yet.</pre>
        </div>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
